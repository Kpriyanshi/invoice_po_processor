services:
  clamav:
    image: clamav/clamav:latest
    ports:
      - "3310:3310"
    healthcheck:
      test: ["CMD", "/usr/local/bin/clamdcheck.sh"]
      interval: 30s
      timeout: 10s
      retries: 10
      start_period: 120s
    restart: unless-stopped

  app:
    build: .
    ports:
      - "8000:8000"
    env_file:
      - .env
    environment:
      CLAMAV_HOST: clamav
      CLAMAV_PORT: 3310
    volumes:
      - ./data:/app/data
      - ./credentials.json:/app/credentials.json:ro
    depends_on:
      clamav:
        condition: service_healthy
    restart: unless-stopped
